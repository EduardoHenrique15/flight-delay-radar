name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Para rodar à mão, por exemplo nos PRs da atualização mensal: os PRs abertos pelo token do
  # GitHub Actions não disparam outros workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff (lint e formatação)
        run: |
          ruff check .
          ruff format --check .

      - name: Pipeline de dados na amostra (carga, referências, dbt build e exportação)
        env:
          FDR_PASTA_VRA: data/fixtures/vra
          FDR_ARQUIVO_AEROPORTOS: data/fixtures/referencia/airports.csv
          FDR_WAREHOUSE: ${{ runner.temp }}/warehouse.duckdb
          FDR_PASTA_MARTS: ${{ runner.temp }}/marts
          FDR_BANCO_APP: ${{ runner.temp }}/app.duckdb
        run: python -m fdr.pipeline --stage data

      - name: Variáveis do modelo na amostra (regra contra vazamento)
        env:
          FDR_WAREHOUSE: ${{ runner.temp }}/warehouse.duckdb
        run: python -m fdr.pipeline --stage features

      - name: Testes
        run: pytest
