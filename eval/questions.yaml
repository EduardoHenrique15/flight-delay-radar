- id: 16
  categoria: agregacao
  pergunta: >-
    Quais as 5 companhias com mais voos atrasados mais de 1 hora em julho de 2026?
  sql: >-
    SELECT cia, sum(atrasados_60) AS atrasados FROM pontualidade_mensal
    WHERE mes = DATE '2026-07-01' GROUP BY cia ORDER BY atrasados DESC LIMIT 5
- id: 17
  categoria: agregacao
  pergunta: >-
    Qual o atraso médio de partida, em minutos, dos voos realizados da Gol em agosto de 2026?
  sql: >-
    SELECT avg(atraso_partida_min) FROM voos
    WHERE cia = 'GLO' AND situacao = 'REALIZADO' AND mes = DATE '2026-08-01'
- id: 18
  categoria: agregacao
  pergunta: >-
    Qual dia de agosto de 2026 teve mais voos nacionais com mais de 15 minutos de atraso?
  sql: >-
    SELECT data_prevista FROM voos
    WHERE tipo_linha = 'N' AND atrasado_15 AND mes = DATE '2026-08-01'
    GROUP BY data_prevista ORDER BY count(*) DESC LIMIT 1
- id: 19
  categoria: juncao
  pergunta: >-
    Entre os aeroportos de Santa Catarina com pelo menos 500 voos nacionais realizados em
    2026, qual tem a maior taxa de atraso?
  sql: >-
    SELECT a.nome FROM pontualidade_mensal p JOIN aeroportos a ON a.icao = p.origem
    WHERE a.uf = 'SC' AND p.tipo_linha = 'N' AND year(p.mes) = 2026
    GROUP BY a.nome HAVING sum(p.realizados_com_horario) >= 500
    ORDER BY sum(p.atrasados_15) / sum(p.realizados_com_horario) DESC LIMIT 1
- id: 20
  categoria: juncao
  pergunta: >-
    Quantos voos nacionais foram realizados a partir de aeroportos do estado do Rio de
    Janeiro em julho de 2026?
  sql: >-
    SELECT sum(p.realizados) FROM pontualidade_mensal p JOIN aeroportos a ON a.icao = p.origem
    WHERE a.uf = 'RJ' AND p.tipo_linha = 'N' AND p.mes = DATE '2026-07-01'
- id: 21
  categoria: juncao
  pergunta: Qual o nome da companhia com mais voos realizados em agosto de 2026?
  sql: >-
    SELECT c.nome FROM pontualidade_mensal p JOIN companhias c ON c.cia = p.cia
    WHERE p.mes = DATE '2026-08-01' GROUP BY c.nome ORDER BY sum(p.realizados) DESC LIMIT 1
  demo: true
- id: 22
  categoria: juncao
  pergunta: Quais as 3 rotas domésticas mais longas que tiveram voos em 2026?
  sql: >-
    SELECT r.origem, r.destino, r.distancia_km FROM rotas r
    WHERE r.domestica AND EXISTS (SELECT 1 FROM voos v WHERE v.origem = r.origem
    AND v.destino = r.destino AND year(v.mes) = 2026)
    ORDER BY r.distancia_km DESC LIMIT 3
- id: 23
  categoria: juncao
  pergunta: >-
    Qual cidade de origem teve mais voos nacionais com mais de 15 minutos de atraso em julho
    de 2026?
  sql: >-
    SELECT a.cidade FROM pontualidade_mensal p JOIN aeroportos a ON a.icao = p.origem
    WHERE p.tipo_linha = 'N' AND p.mes = DATE '2026-07-01'
    GROUP BY a.cidade ORDER BY sum(p.atrasados_15) DESC LIMIT 1
