- id: 26
  categoria: tempo
  pergunta: >-
    Compare a taxa de atraso dos voos nacionais em dezembro de 2024 e em dezembro de 2025.
  sql: >-
    SELECT mes, sum(atrasados_15) / sum(realizados_com_horario) AS taxa FROM pontualidade_mensal
    WHERE tipo_linha = 'N' AND mes IN (DATE '2024-12-01', DATE '2025-12-01')
    GROUP BY mes ORDER BY mes
- id: 27
  categoria: tempo
  pergunta: Quantos voos nacionais foram cancelados no último mês disponível?
  sql: >-
    SELECT sum(cancelados) FROM pontualidade_mensal
    WHERE tipo_linha = 'N' AND mes = (SELECT max(mes) FROM pontualidade_mensal)
- id: 28
  categoria: tempo
  pergunta: Qual trimestre de 2025 teve mais voos nacionais realizados?
