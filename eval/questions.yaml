# Perguntas da avaliação do assistente, com o SQL de referência escrito à mão
# (PROJETO.md, seção 8.4). "recusar: true" marca as perguntas que os dados não respondem.
# "demo: true" marca as que viram respostas de demonstração (modo sem chave).

- id: 1
  categoria: simples
  pergunta: Quantos voos foram realizados em julho de 2026?
  sql: SELECT sum(realizados) FROM pontualidade_mensal WHERE mes = DATE '2026-07-01'
  demo: true
