    SELECT sum(realizados) FROM pontualidade_mensal
    WHERE tipo_linha = 'I' AND mes = DATE '2026-07-01'
- id: 11
  categoria: agregacao
  pergunta: >-
    Entre as companhias com pelo menos 1000 voos nacionais realizados em julho de 2026, qual
    teve a maior taxa de atraso?
  sql: >-
    SELECT cia FROM pontualidade_mensal WHERE tipo_linha = 'N' AND mes = DATE '2026-07-01'
    GROUP BY cia HAVING sum(realizados_com_horario) >= 1000
    ORDER BY sum(atrasados_15) / sum(realizados_com_horario) DESC LIMIT 1
- id: 12
  categoria: agregacao
  pergunta: Quais os 5 aeroportos de origem com mais voos nacionais cancelados em 2026?
  sql: >-
    SELECT origem, sum(cancelados) AS cancelados FROM pontualidade_mensal
    WHERE tipo_linha = 'N' AND year(mes) = 2026
    GROUP BY origem ORDER BY cancelados DESC LIMIT 5
  demo: true
- id: 13
  categoria: agregacao
  pergunta: Em que hora do dia os voos nacionais regulares têm a maior taxa de atraso?
  sql: >-
    SELECT hora_prevista FROM atraso_rota_hora GROUP BY hora_prevista
    ORDER BY sum(atrasados_15) / sum(voos) DESC LIMIT 1
  demo: true
- id: 14
  categoria: agregacao
  pergunta: Quais as 3 companhias com mais voos nacionais realizados em agosto de 2026?
  sql: >-
    SELECT cia, sum(realizados) AS realizados FROM pontualidade_mensal
    WHERE tipo_linha = 'N' AND mes = DATE '2026-08-01'
    GROUP BY cia ORDER BY realizados DESC LIMIT 3
- id: 15
